<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Drop Game | charity: water</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Montserrat closely resembles charity: water's brand typeface, Proxima Nova -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Keep your charity: water logo from the starter's img folder here, e.g.:
         <img src="img/cw_logo.png" alt="charity: water logo" class="logo"> -->

    <h1 class="game-title">Water Drop</h1>
    <p class="game-tagline">Catch the clean drops. Dodge the dirty ones.</p>

    <div class="difficulty" role="group" aria-label="Difficulty">
      <button class="diff-btn" data-level="easy">Easy</button>
      <button class="diff-btn active" data-level="normal">Normal</button>
      <button class="diff-btn" data-level="hard">Hard</button>
    </div>
    <p id="goal-text" class="goal-text"></p>

    <div class="score-panel">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="timer">Time: <span id="time">30</span>s</div>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-container">
      <div id="milestone" class="milestone" role="status" aria-live="polite"></div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </div>

    <footer class="site-footer">
      <p>Clean water changes everything. Learn how you can help.</p>
      <nav>
        <a href="https://www.charitywater.org/" target="_blank" rel="noopener">Visit charity: water</a>
        <a class="donate" href="https://www.charitywater.org/donate" target="_blank" rel="noopener">Donate</a>
      </nav>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
